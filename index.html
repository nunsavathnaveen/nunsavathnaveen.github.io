<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naveen Kumar · Apps</title>
<style>
  :root { --bg: #F5F7FA; --surface: #FFFFFF; --border: #D4DCE6; --text: #1A2233; --muted: #5A6A7E; --teal: #00917C; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B1220; --surface: #132035; --border: #253D5E; --text: #E8ECF2; --muted: #8A99B0; --teal: #00E5C3; }
  }
  body { margin: 0; padding: 40px 16px; background: var(--bg); color: var(--text);
         font-family: -apple-system, Roboto, "Segoe UI", sans-serif; line-height: 1.55; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .app { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; }
  .app h2 { font-size: 1.1rem; margin: 0 0 6px; }
  a { color: var(--teal); }
</style>
</head>
<body>
<main>
  <h1>Naveen Kumar · Android Apps</h1>
  <p>Privacy policies for my apps on Google Play.</p>
  <div class="app">
    <h2>SonicDry: Speaker Cleaner &amp; Sound Toolkit</h2>
    <a href="sonicdry/privacy-policy.html">Privacy Policy</a>
  </div>
</main>
</body>
</html>
